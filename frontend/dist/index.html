<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project Montage</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f0f13;color:#e2e2e8;min-height:100vh}
  :root{--accent:#7c6af7;--accent2:#a78bfa;--bg:#0f0f13;--surface:#1a1a24;--surface2:#23232f;--border:#2e2e3e;--success:#34d399;--error:#f87171;--warn:#fbbf24;--text:#e2e2e8;--muted:#8b8ba0}
  a{color:var(--accent2);text-decoration:none}
  button{cursor:pointer;border:none;outline:none;font-family:inherit}

  .app{display:flex;flex-direction:column;min-height:100vh}
  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;gap:16px}
  .header h1{font-size:1.25rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .header .subtitle{color:var(--muted);font-size:.85rem}

  .main{display:flex;flex:1;gap:0}
  .sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:12px 0;flex-shrink:0}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:.9rem;color:var(--muted);transition:all .15s;border-left:3px solid transparent}
  .nav-item:hover{background:var(--surface2);color:var(--text)}
  .nav-item.active{background:var(--surface2);color:var(--accent2);border-left-color:var(--accent)}
  .nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:.7rem;padding:2px 7px;border-radius:99px}

  .content{flex:1;padding:28px 32px;overflow-y:auto;max-width:960px}
  .page-title{font-size:1.4rem;font-weight:700;margin-bottom:4px}
  .page-sub{color:var(--muted);font-size:.88rem;margin-bottom:24px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
  .card h3{font-size:1rem;font-weight:600;margin-bottom:14px;color:var(--text)}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
  .field input,.field textarea,.field select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:9px 12px;color:var(--text);font-family:inherit;font-size:.9rem;transition:border .15s}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);outline:none}
  .field textarea{resize:vertical;min-height:80px}
  .toggle-group{display:flex;gap:8px}
  .toggle-btn{flex:1;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:.88rem;transition:all .15s}
  .toggle-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  .btn{padding:10px 20px;border-radius:7px;font-size:.9rem;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:7px}
  .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{filter:brightness(1.15)}
  .btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text)}.btn-secondary:hover{border-color:var(--accent)}
  .btn-danger{background:#7f1d1d;color:#fca5a5;border:1px solid #ef4444}.btn-danger:hover{background:#991b1b}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

  .status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:600}
  .status-queued{background:#1c1c2e;color:#8b8ba0;border:1px solid #2e2e3e}
  .status-running{background:#1a1a00;color:#fbbf24;border:1px solid #854d0e}
  .status-complete{background:#052e16;color:#34d399;border:1px solid #166534}
  .status-failed{background:#2d0a0a;color:#f87171;border:1px solid #7f1d1d}

  .log-box{background:#0a0a0f;border:1px solid var(--border);border-radius:7px;padding:12px 14px;font-family:'Cascadia Code','Fira Code',monospace;font-size:.78rem;max-height:260px;overflow-y:auto;line-height:1.6;color:#a0a0b8}
  .log-box .log-line{color:#c8c8d8}.log-box .log-err{color:var(--error)}.log-box .log-ok{color:var(--success)}

  .progress-bar{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:10px 0}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s}

  .result-box{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:14px;margin-top:12px}
  .result-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:.87rem}
  .result-row:last-child{border:none}
  .result-key{color:var(--muted)}
  .result-val{color:var(--text);font-weight:500;text-align:right;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .run-list{display:flex;flex-direction:column;gap:8px}
  .run-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border .15s}
  .run-card:hover{border-color:var(--accent)}
  .run-card .run-id{font-weight:700;font-size:.9rem}
  .run-card .run-meta{color:var(--muted);font-size:.8rem;margin-top:2px}
  .run-card .run-actions{margin-left:auto;display:flex;gap:8px}

  .video-player{width:100%;border-radius:8px;border:1px solid var(--border);background:#000;max-height:420px}
  .char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:12px}
  .char-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
  .char-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--border);margin-bottom:8px}
  .char-name{font-weight:700;font-size:.88rem}
  .char-role{color:var(--muted);font-size:.78rem;margin-top:2px}

  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .dot-running{background:var(--warn);animation:pulse 1s infinite}
  .dot-complete{background:var(--success)}
  .dot-failed{background:var(--error)}
  .dot-queued{background:var(--muted)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .empty{color:var(--muted);font-size:.9rem;padding:32px;text-align:center;border:1px dashed var(--border);border-radius:8px}
  .divider{border:none;border-top:1px solid var(--border);margin:20px 0}
  .tag{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:.75rem;color:var(--muted)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef, useCallback} = React;
const API = '';  // same origin

// ── API helpers ───────────────────────────────────────────────────────────────
async function api(path, opts={}) {
  const r = await fetch(API + path, {headers:{'Content-Type':'application/json'}, ...opts});
  if (!r.ok) { const t = await r.text(); throw new Error(t); }
  return r.json();
}
const post = (path, body) => api(path, {method:'POST', body:JSON.stringify(body)});

// ── Status pill ───────────────────────────────────────────────────────────────
function StatusPill({status}) {
  const dot = {running:'dot-running',complete:'dot-complete',failed:'dot-failed',queued:'dot-queued'}[status]||'dot-queued';
  return <span className={`status-pill status-${status||'queued'}`}><span className={`dot ${dot}`}/>{status||'idle'}</span>;
}

// ── Log box ───────────────────────────────────────────────────────────────────
function LogBox({logs=[]}) {
  const ref = useRef();
  useEffect(()=>{ if(ref.current) ref.current.scrollTop = ref.current.scrollHeight; },[logs]);
  if(!logs.length) return <div className="log-box" ref={ref}><span style={{color:'#555'}}>Waiting for logs…</span></div>;
  return (
    <div className="log-box" ref={ref}>
      {logs.map((l,i)=>{
        const cls = l.includes('ERROR')||l.includes('FAILED') ? 'log-err' : l.includes('✓')||l.includes('complete') ? 'log-ok' : 'log-line';
        return <div key={i} className={cls}>{l}</div>;
      })}
    </div>
  );
}

// ── Job runner hook ───────────────────────────────────────────────────────────
function useJob() {
  const [job, setJob] = useState(null);
  const wsRef = useRef(null);

  const start = useCallback(async (endpoint, body) => {
    if(wsRef.current) wsRef.current.close();
    setJob({status:'queued', logs:[], result:null, error:null});
    try {
      const res = await post(endpoint, body);
      const jobId = res.job_id;
      const ws = new WebSocket(`ws://${location.host}/api/pipeline/ws/${jobId}`);
      wsRef.current = ws;
      ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if(d.log) setJob(j=>({...j, logs:[...(j?.logs||[]), d.log]}));
        if(d.status) setJob(j=>({...j, status:d.status, result:d.result}));
        if(d.error)  setJob(j=>({...j, status:'failed', error:d.error}));
      };
      ws.onerror = () => setJob(j=>({...j, status:'failed', error:'WebSocket error'}));
      setJob(j=>({...j, status:'running', job_id:jobId}));
    } catch(e) {
      setJob({status:'failed', logs:[], error:e.message, result:null});
    }
  }, []);

  return {job, start};
}

// ── Phase 1 page ──────────────────────────────────────────────────────────────
function Phase1Page() {
  const [mode, setMode] = useState('auto');
  const [input, setInput] = useState('');
  // step: 'idle' | 'generating' | 'review' | 'resuming' | 'done' | 'failed'
  const [step, setStep] = useState('idle');
  const [jobId, setJobId] = useState(null);
  const [logs, setLogs] = useState([]);
  const [script, setScript] = useState(null);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [hitlEdit, setHitlEdit] = useState('');
  const [characters, setCharacters] = useState([]);
  const wsRef = useRef(null);

  // Reload characters after completion
  useEffect(() => {
    if (step === 'done') {
      api('/api/files/character-db')
        .then(d => setCharacters(Array.isArray(d) ? d : d.characters || []))
        .catch(() => {});
    }
  }, [step]);

  const openWs = (jid, onPendingHitl) => {
    if (wsRef.current) wsRef.current.close();
    const ws = new WebSocket(`ws://${location.host}/api/pipeline/ws/${jid}`);
    wsRef.current = ws;
    ws.onmessage = (e) => {
      const d = JSON.parse(e.data);
      if (d.log) setLogs(prev => [...prev, d.log]);
      if (d.status === 'pending_hitl') {
        setScript(d.script || null);
        onPendingHitl();
      }
      if (d.status === 'complete') { setResult(d.result); setStep('done'); }
      if (d.status === 'failed')   { setError(d.error || 'Pipeline failed'); setStep('failed'); }
    };
    ws.onerror = () => { setError('WebSocket error'); setStep('failed'); };
  };

  const runGenerate = async () => {
    if (!input.trim()) return;
    setStep('generating'); setLogs([]); setScript(null);
    setResult(null); setError(null); setHitlEdit('');
    try {
      const res = await post('/api/pipeline/phase1/generate', { mode, raw_input: input });
      setJobId(res.job_id);
      openWs(res.job_id, () => setStep('review'));
    } catch (e) {
      setError(e.message); setStep('failed');
    }
  };

  const submitDecision = async (decision) => {
    if (decision === 'edit' && !hitlEdit.trim()) {
      alert('Paste the corrected JSON first.'); return;
    }
    let parsed_edit = undefined;
    if (decision === 'edit') {
      try { parsed_edit = JSON.parse(hitlEdit); }
      catch { alert('Invalid JSON — check the edit payload.'); return; }
    }
    setStep('resuming');
    try {
      await post('/api/pipeline/phase1/resume', {
        job_id: jobId, hitl_decision: decision, hitl_edit: parsed_edit,
      });
      // WS is already open and will fire the complete/failed events
    } catch (e) {
      setError(e.message); setStep('failed');
    }
  };

  const reset = () => {
    if (wsRef.current) wsRef.current.close();
    setStep('idle'); setLogs([]); setScript(null);
    setResult(null); setError(null); setJobId(null);
  };

  // ── Render helpers ──────────────────────────────────────────────────────────

  const ScriptReview = () => {
    if (!script) return null;
    return (
      <div className="card" style={{borderColor:'var(--accent)'}}>
        <h3 style={{display:'flex',alignItems:'center',gap:10}}>
          <span>🎬 Script ready for review</span>
          <StatusPill status="pending_hitl"/>
        </h3>

        {/* Script summary */}
        <div className="result-box" style={{marginBottom:14}}>
          {[['Title', script.title||'Untitled'],['Genre', script.genre||'—'],['Scenes', script.total_scenes||0]]
            .map(([k,v]) => (
              <div key={k} className="result-row">
                <span className="result-key">{k}</span>
                <span className="result-val">{String(v)}</span>
              </div>
            ))}
        </div>

        {/* Scene list */}
        <div style={{maxHeight:320,overflowY:'auto',marginBottom:16}}>
          {(script.scenes||[]).map((sc, i) => (
            <div key={i} style={{
              background:'var(--surface2)',border:'1px solid var(--border)',
              borderRadius:7,padding:'12px 14px',marginBottom:8
            }}>
              <div style={{fontWeight:700,marginBottom:4,fontSize:'.88rem'}}>
                Scene {sc.scene_id} — {sc.location}
              </div>
              {sc.characters?.length > 0 && (
                <div style={{color:'var(--muted)',fontSize:'.78rem',marginBottom:6}}>
                  Characters: {sc.characters.join(', ')}
                </div>
              )}
              <div style={{color:'var(--text)',fontSize:'.82rem',marginBottom:8,lineHeight:1.5}}>
                {sc.action_description?.slice(0,180)}{sc.action_description?.length>180?'…':''}
              </div>
              {(sc.dialogue||[]).slice(0,2).map((dl, j) => (
                <div key={j} style={{
                  borderLeft:'2px solid var(--accent)',paddingLeft:8,
                  marginBottom:4,fontSize:'.8rem',color:'var(--muted)'
                }}>
                  <strong style={{color:'var(--text)'}}>{dl.speaker}:</strong> "{dl.line}"
                </div>
              ))}
              {sc.dialogue?.length > 2 && (
                <div style={{color:'var(--muted)',fontSize:'.75rem'}}>
                  +{sc.dialogue.length - 2} more lines…
                </div>
              )}
            </div>
          ))}
        </div>

        {/* Edit JSON field */}
        <div className="field" style={{marginBottom:14}}>
          <label>Edit script JSON (optional — paste corrected JSON to submit with "Apply edit")</label>
          <textarea
            value={hitlEdit}
            onChange={e => setHitlEdit(e.target.value)}
            rows={4}
            placeholder='{"title":"…","scenes":[…]}'
            style={{fontFamily:'monospace',fontSize:'.8rem'}}
          />
        </div>

        {/* Decision buttons */}
        <div className="btn-row">
          <button className="btn btn-primary" onClick={() => submitDecision('yes')}>
            ✅ Approve & continue
          </button>
          <button
            className="btn btn-secondary"
            onClick={() => submitDecision('edit')}
            disabled={!hitlEdit.trim()}
          >
            ✏️ Apply edit & continue
          </button>
          <button className="btn btn-danger" onClick={() => submitDecision('no')}>
            ❌ Reject
          </button>
        </div>
      </div>
    );
  };

  // ── Main render ─────────────────────────────────────────────────────────────
  return (
    <div>
      <div className="page-title">Phase 1 — Story & Script</div>
      <div className="page-sub">Generate a screenplay from a prompt, or upload your own.</div>

      {/* Input card — hidden once generation starts */}
      {step === 'idle' && (
        <div className="card">
          <h3>Input</h3>
          <div className="field">
            <label>Mode</label>
            <div className="toggle-group">
              {['auto','manual'].map(m => (
                <button key={m} className={`toggle-btn ${mode===m?'active':''}`} onClick={() => setMode(m)}>
                  {m==='auto'?'🤖 Generate from prompt':'📄 Upload screenplay'}
                </button>
              ))}
            </div>
          </div>
          <div className="field">
            <label>{mode==='auto'?'Story Prompt':'Screenplay Text'}</label>
            <textarea
              value={input} onChange={e => setInput(e.target.value)}
              rows={mode==='auto'?3:8}
              placeholder={mode==='auto'
                ? 'e.g. A spy thriller set in 1960s Berlin…'
                : 'Paste your screenplay here (INT./EXT. headings required)'}
            />
          </div>
          <div className="btn-row">
            <button className="btn btn-primary" onClick={runGenerate} disabled={!input.trim()}>
              ▶ Generate script
            </button>
          </div>
        </div>
      )}

      {/* Generation progress */}
      {(step === 'generating' || step === 'review' || step === 'resuming') && (
        <div className="card">
          <h3>
            {step === 'generating' && 'Generating script…'}
            {step === 'review'     && 'Review generated script'}
            {step === 'resuming'   && 'Running pipeline…'}
            &nbsp;<StatusPill status={step === 'review' ? 'pending_hitl' : 'running'}/>
          </h3>
          <LogBox logs={logs}/>
        </div>
      )}

      {/* HITL review panel */}
      {step === 'review' && <ScriptReview/>}

      {/* Final result */}
      {step === 'done' && (
        <div className="card">
          <h3>Phase 1 complete <StatusPill status="complete"/></h3>
          {result && (
            <div className="result-box">
              {Object.entries(result).map(([k,v]) => (
                <div key={k} className="result-row">
                  <span className="result-key">{k}</span>
                  <span className="result-val">{String(v)}</span>
                </div>
              ))}
            </div>
          )}
          <div className="btn-row" style={{marginTop:14}}>
            <button className="btn btn-secondary" onClick={reset}>↩ Run again</button>
          </div>
        </div>
      )}

      {/* Error */}
      {step === 'failed' && (
        <div className="card" style={{borderColor:'var(--error)'}}>
          <h3>Failed <StatusPill status="failed"/></h3>
          {logs.length > 0 && <LogBox logs={logs}/>}
          <div style={{color:'var(--error)',marginTop:8,fontSize:'.85rem'}}>{error}</div>
          <div className="btn-row" style={{marginTop:14}}>
            <button className="btn btn-secondary" onClick={reset}>↩ Try again</button>
          </div>
        </div>
      )}

      {/* Characters (shown after completion) — images from Phase 3 */}
      {characters.length > 0 && (
        <div className="card">
          <h3>Characters ({characters.length})</h3>
          <div style={{color:'var(--muted)',fontSize:'.82rem',marginBottom:12}}>
            Character images are generated in Phase 3. Complete Phase 3 to see rendered portraits.
          </div>
          <div className="char-grid">
            {characters.map((c,i) => (
              <div key={i} className="char-card">
                <div className="char-img" style={{display:'flex',alignItems:'center',justifyContent:'center',fontSize:'2rem',background:'var(--border)'}}>
                  📸
                </div>
                <div className="char-name">{c.name}</div>
                <div className="char-role">{c.personality?.split(',')[0]||'Character'}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Phase 2 page ──────────────────────────────────────────────────────────────
function Phase2Page() {
  const [phase1Dir, setPhase1Dir] = useState('data/outputs');
  const {job, start} = useJob();

  const run = () => start('/api/pipeline/phase2', {
    phase1_dir: phase1Dir,
    phase2_dir: 'data/outputs/Phase2',
  });

  return (
    <div>
      <div className="page-title">Phase 2 — Audio Generation</div>
      <div className="page-sub">Synthesise dialogue with Edge-TTS and layer background music via Freesound.</div>
      <div className="card">
        <h3>Configuration</h3>
        <div className="field">
          <label>Phase 1 Output Directory</label>
          <input value={phase1Dir} onChange={e=>setPhase1Dir(e.target.value)}/>
        </div>
        <div className="btn-row">
          <button className="btn btn-primary" onClick={run} disabled={job?.status==='running'}>
            {job?.status==='running'?'⏳ Running…':'▶ Run Phase 2'}
          </button>
        </div>
      </div>
      {job && (
        <div className="card">
          <h3>Progress <StatusPill status={job.status}/></h3>
          <LogBox logs={job.logs}/>
          {job.result && (
            <div className="result-box">
              {Object.entries(job.result).map(([k,v])=>(
                <div key={k} className="result-row"><span className="result-key">{k}</span><span className="result-val">{String(v)}</span></div>
              ))}
              {job.result.run_id && job.result.master_audio && (
                <div style={{marginTop:12}}>
                  <audio controls style={{width:'100%'}} src={`/api/files/audio/${job.result.run_id}`}/>
                </div>
              )}
            </div>
          )}
          {job.error && <div style={{color:'var(--error)',marginTop:8,fontSize:'.85rem'}}>Error: {job.error}</div>}
        </div>
      )}
    </div>
  );
}

// ── Phase 3 page ──────────────────────────────────────────────────────────────
function Phase3Page() {
  const [phase1Dir, setPhase1Dir] = useState('data/outputs');
  const [mock, setMock] = useState(true);
  const [short, setShort] = useState(true);
  const [subtitles, setSubtitles] = useState(false);
  const {job, start} = useJob();
  const [lipSync, setLipSync] = useState(false);

  const run = () => start(
    short ? '/api/pipeline/phase3/short' : '/api/pipeline/phase3',
    {phase1_dir: phase1Dir, mock, use_subtitles: subtitles, short_mode: short, use_lip_sync: lipSync}
  );

  return (
    <div>
      <div className="page-title">Phase 3 — Video Generation</div>
      <div className="page-sub">Generate scene images, animate with Ken Burns effect, compose final MP4.</div>
      <div className="card">
        <h3>Configuration</h3>
        <div className="field">
          <label>Phase 1 Output Directory</label>

// ── Phase 5 page ──────────────────────────────────────────────────────────────
function Phase5Page() {
  const [query, setQuery] = React.useState('');
  const [job, setJob] = React.useState(null);
  const [history, setHistory] = React.useState([]);
  const [wsRef] = React.useState({current: null});

  const loadHistory = async () => {
    try {
      const d = await api('/api/edit/history');
      setHistory(d.versions || []);
    } catch(e) {}
  };

  React.useEffect(() => { loadHistory(); }, [job?.status]);

  const runEdit = async () => {
    if (!query.trim()) return;
    if (wsRef.current) wsRef.current.close();
    setJob({status:'queued', logs:[], result:null});
    try {
      const res = await post('/api/edit/apply', {query});
      const jobId = res.job_id;
      const ws = new WebSocket('ws://' + location.host + '/api/edit/ws/' + jobId);
      wsRef.current = ws;
      ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if (d.log) setJob(j => ({...j, logs:[...(j?.logs||[]), d.log]}));
        if (d.status) setJob(j => ({...j, status:d.status, result:d.result}));
      };
      ws.onerror = () => setJob(j => ({...j, status:'failed', error:'WebSocket error'}));
      setJob(j => ({...j, status:'running', job_id:jobId}));
    } catch(e) {
      setJob({status:'failed', logs:[], error:e.message});

  };

  const doUndo = async (version) => {
    try {
      await post('/api/edit/undo/' + version, {version});

  const examples = [

    'Add background music',

    'Regenerate the script',

    <div>

        <h3>Edit Command</h3>

          <div style={{color:'var(--muted)',fontSize:'.78rem',marginBottom:6}}>Examples:</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
            {examples.map((ex,i)=>(
              <button key={i} className="tag" style={{cursor:'pointer',padding:'4px 10px'}}
                onClick={()=>setQuery(ex)}>{ex}</button>
            ))}
          </div>
        </div>
        <div className="btn-row">
          <button className="btn btn-primary" onClick={runEdit} disabled={!query.trim()||job?.status==='running'}>
            {job?.status==='running'?'⏳ Running…':'✏️ Apply Edit'}
          </button>
        </div>
      </div>

      {job && (
        <div className="card">
          <h3>Progress <StatusPill status={job.status}/></h3>
          <LogBox logs={job.logs}/>
          {job.result && (

                </div>

                <span className="result-val">v{String(job.result.snapshot_before).padStart(3,'0')}</span>

                <span className="result-val">{job.result.steps_completed}</span>

            </div>

          {job.error && <div style={{color:'var(--error)',marginTop:8,fontSize:'.85rem'}}>Error: {job.error}</div>}
        </div>
      )}

// ── Pipeline (connected flow) page ───────────────────────────────────────────
function PipelinePage({setPage}) {
  // Pipeline state machine: idle → p1_running → p1_review → p1_resuming → p1_done
  //                          → p2_running → p2_done → p3_running → p3_done
  const [stage, setStage]     = useState('idle');   // current stage
  const [storyTitle, setStoryTitle] = useState('');
  const [storyGenre, setStoryGenre] = useState('');

  // Phase 1
  const [mode, setMode]       = useState('auto');
  const [input, setInput]     = useState('');
  const [p1Logs, setP1Logs]   = useState([]);
  const [p1JobId, setP1JobId] = useState(null);
  const [p1Script, setP1Script] = useState(null);
  const [p1Result, setP1Result] = useState(null);
  const [hitlEdit, setHitlEdit] = useState('');
  const p1Ws = useRef(null);

  // Phase 2
  const [p2Logs, setP2Logs]   = useState([]);
  const [p2Result, setP2Result] = useState(null);
  const p2Ws = useRef(null);

  // Phase 3
  const [mock, setMock]       = useState(false);
  const [short, setShort]     = useState(false);
  const [subtitles, setSubs]  = useState(false);
  const [p3Logs, setP3Logs]   = useState([]);
  const [p3Result, setP3Result] = useState(null);
  const p3Ws = useRef(null);

  const [error, setError]     = useState(null);

  // ── Phase 1 ────────────────────────────────────────────────────────────────
  const runP1 = async () => {
    if (!input.trim()) return;
    setStage('p1_running'); setP1Logs([]); setError(null);
    setP1Script(null); setP1Result(null);
    try {
      const res = await post('/api/pipeline/phase1/generate', {mode, raw_input: input});
      setP1JobId(res.job_id);
      if (p1Ws.current) p1Ws.current.close();
      const ws = new WebSocket(`ws://${location.host}/api/pipeline/ws/${res.job_id}`);
      p1Ws.current = ws;
      ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if (d.log) setP1Logs(prev => [...prev, d.log]);
        if (d.status === 'pending_hitl') {
          setP1Script(d.script || null);
          setStoryTitle(d.script?.title || '');
          setStoryGenre(d.script?.genre || '');
          setStage('p1_review');
        }
        if (d.status === 'complete') { setP1Result(d.result); setStage('p1_done'); }
        if (d.status === 'failed')   { setError(d.error || 'Phase 1 failed'); setStage('failed'); }
      };
      ws.onerror = () => { setError('WebSocket error'); setStage('failed'); };
    } catch(e) { setError(e.message); setStage('failed'); }
  };

  const submitHitl = async (decision) => {
    if (decision === 'edit' && !hitlEdit.trim()) { alert('Paste corrected JSON first.'); return; }
    let parsed_edit;
    if (decision === 'edit') {
      try { parsed_edit = JSON.parse(hitlEdit); }
      catch { alert('Invalid JSON.'); return; }
    }
    setStage('p1_resuming');
    try {
      await post('/api/pipeline/phase1/resume', {job_id: p1JobId, hitl_decision: decision, hitl_edit: parsed_edit});
    } catch(e) { setError(e.message); setStage('failed'); }
  };

  // ── Phase 2 ────────────────────────────────────────────────────────────────
  const runP2 = async () => {
    setStage('p2_running'); setP2Logs([]); setP2Result(null); setError(null);
    try {
      const res = await post('/api/pipeline/phase2', {
        phase1_dir: 'data/outputs', phase2_dir: 'data/outputs/Phase2',
      });
      if (p2Ws.current) p2Ws.current.close();
      const ws = new WebSocket(`ws://${location.host}/api/pipeline/ws/${res.job_id}`);
      p2Ws.current = ws;
      ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if (d.log) setP2Logs(prev => [...prev, d.log]);
        if (d.status === 'complete') { setP2Result(d.result); setStage('p2_done'); }
        if (d.status === 'failed')   { setError(d.error || 'Phase 2 failed'); setStage('failed'); }
      };
      ws.onerror = () => { setError('WebSocket error'); setStage('failed'); };
    } catch(e) { setError(e.message); setStage('failed'); }
  };

  // ── Phase 3 ────────────────────────────────────────────────────────────────
  const runP3 = async () => {
    setStage('p3_running'); setP3Logs([]); setP3Result(null); setError(null);
    const endpoint = short ? '/api/pipeline/phase3/short' : '/api/pipeline/phase3';
    try {
      const res = await post(endpoint, {
        phase1_dir: 'data/outputs', mock, use_subtitles: subtitles, short_mode: short, use_lip_sync: false,
      });
      if (p3Ws.current) p3Ws.current.close();
      const ws = new WebSocket(`ws://${location.host}/api/pipeline/ws/${res.job_id}`);
      p3Ws.current = ws;
      ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if (d.log) setP3Logs(prev => [...prev, d.log]);
        if (d.status === 'complete') { setP3Result(d.result); setStage('p3_done'); }
        if (d.status === 'failed')   { setError(d.error || 'Phase 3 failed'); setStage('failed'); }
      };
      ws.onerror = () => { setError('WebSocket error'); setStage('failed'); };
    } catch(e) { setError(e.message); setStage('failed'); }
  };

  const reset = () => {
    [p1Ws, p2Ws, p3Ws].forEach(r => r.current?.close());
    setStage('idle'); setP1Logs([]); setP2Logs([]); setP3Logs([]);
    setP1Script(null); setP1Result(null); setP2Result(null); setP3Result(null);
    setStoryTitle(''); setStoryGenre(''); setError(null); setInput('');
  };

  // ── Step indicator ─────────────────────────────────────────────────────────
  const steps = [
    {key:'p1', label:'Script', stages:['p1_running','p1_review','p1_resuming','p1_done']},
    {key:'p2', label:'Audio',  stages:['p2_running','p2_done']},
    {key:'p3', label:'Video',  stages:['p3_running','p3_done']},
    {key:'p5', label:'Edit',   stages:[]},
  ];
  const stageOrder = ['idle','p1_running','p1_review','p1_resuming','p1_done','p2_running','p2_done','p3_running','p3_done','failed'];
  const stageIdx   = stageOrder.indexOf(stage);

  const stepState = (s) => {
    if (stage === 'failed') {
      if (s.key==='p1' && stageIdx <= 4) return 'active';
      if (s.key==='p2' && stageIdx===5)  return 'active';
      if (s.key==='p3' && stageIdx>=6)   return 'active';
      return stageIdx > stageOrder.indexOf(s.stages[s.stages.length-1]||'idle') ? 'done' : 'idle';
    }
    if (s.stages.some(st => stage === st)) return 'running';
    const lastDoneStage = s.key==='p1'?'p1_done': s.key==='p2'?'p2_done': s.key==='p3'?'p3_done': '';
    if (lastDoneStage && stageOrder.indexOf(stage) > stageOrder.indexOf(lastDoneStage)) return 'done';
    return 'idle';
  };

  const StepBar = () => (
    <div style={{display:'flex',alignItems:'center',gap:0,marginBottom:24}}>
      {steps.map((s,i) => {
        const st = stepState(s);
        const color = st==='done'?'var(--success)': st==='running'?'var(--accent)': st==='active'?'var(--error)':'var(--muted)';
        return (
          <React.Fragment key={s.key}>
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,flex:1}}>
              <div style={{
                width:32,height:32,borderRadius:'50%',border:`2px solid ${color}`,
                display:'flex',alignItems:'center',justifyContent:'center',
                fontSize:'.8rem',fontWeight:700,color,background:'var(--surface)',
              }}>
                {st==='done'?'✓': st==='running'?<span style={{animation:'pulse 1s infinite',display:'inline-block'}}>●</span>: i+1}
              </div>
              <div style={{fontSize:'.75rem',color,fontWeight:st==='running'?700:400}}>{s.label}</div>
            </div>
            {i < steps.length-1 && (
              <div style={{flex:2,height:2,background: stageOrder.indexOf(stage) > stageOrder.indexOf(steps[i].stages[steps[i].stages.length-1]||'p1_done') ? 'var(--success)' : 'var(--border)',marginBottom:16}}/>
            )}
          </React.Fragment>
        );
      })}
    </div>
  );

  // ── Story title banner (shown once we have it) ─────────────────────────────
  const TitleBanner = () => !storyTitle ? null : (
    <div style={{
      background:'linear-gradient(135deg,rgba(124,106,247,.15),rgba(167,139,250,.1))',
      border:'1px solid var(--accent)',borderRadius:8,padding:'10px 16px',
      marginBottom:16,display:'flex',alignItems:'center',gap:10,
    }}>
      <span style={{fontSize:'1.2rem'}}>🎬</span>
      <div>
        <div style={{fontWeight:700,fontSize:'1rem'}}>{storyTitle}</div>
        {storyGenre && <div style={{color:'var(--muted)',fontSize:'.8rem'}}>{storyGenre}</div>}
      </div>
      <div style={{marginLeft:'auto'}}><StatusPill status="complete"/></div>
    </div>
  );

  return (
    <div>
      <div className="page-title">Pipeline — Full Run</div>
      <div className="page-sub">Run all phases in sequence. Each phase feeds directly into the next.</div>

      <StepBar/>
      {storyTitle && <TitleBanner/>}

      {/* ── STAGE: idle ── */}
      {stage === 'idle' && (
        <div className="card">
          <h3>Step 1 of 3 — Generate Script</h3>
          <div className="field">
            <label>Mode</label>
            <div className="toggle-group">
              {['auto','manual'].map(m=>(
                <button key={m} className={`toggle-btn ${mode===m?'active':''}`} onClick={()=>setMode(m)}>
                  {m==='auto'?'🤖 Generate from prompt':'📄 Upload screenplay'}
                </button>
              ))}
            </div>
          </div>
          <div className="field">
            <label>{mode==='auto'?'Story Prompt':'Screenplay Text'}</label>
            <textarea value={input} onChange={e=>setInput(e.target.value)} rows={mode==='auto'?3:8}
              placeholder={mode==='auto'?'e.g. A spy thriller set in 1960s Berlin…':'Paste your screenplay here…'}/>
          </div>
          <div className="btn-row">
            <button className="btn btn-primary" onClick={runP1} disabled={!input.trim()}>
              ▶ Start Pipeline
            </button>
          </div>
        </div>
      )}

      {/* ── STAGE: p1 running / resuming ── */}
      {(stage==='p1_running'||stage==='p1_resuming') && (
        <div className="card">
          <h3>{stage==='p1_resuming'?'Building characters…':'Generating script…'} <StatusPill status="running"/></h3>
          <LogBox logs={p1Logs}/>
        </div>
      )}

      {/* ── STAGE: p1 review ── */}
      {stage==='p1_review' && p1Script && (
        <div className="card" style={{borderColor:'var(--accent)'}}>
          <h3>📋 Review Script <StatusPill status="pending_hitl"/></h3>
          <LogBox logs={p1Logs}/>
          <div className="result-box" style={{margin:'12px 0'}}>
            {[['Title',p1Script.title||'Untitled'],['Genre',p1Script.genre||'—'],['Scenes',p1Script.total_scenes||0]]
              .map(([k,v])=>(
                <div key={k} className="result-row">
                  <span className="result-key">{k}</span>
                  <span className="result-val">{String(v)}</span>
                </div>
              ))}
          </div>
          <div style={{maxHeight:240,overflowY:'auto',marginBottom:12}}>
            {(p1Script.scenes||[]).map((sc,i)=>(
              <div key={i} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:6,padding:'10px 12px',marginBottom:8}}>
                <div style={{fontWeight:700,fontSize:'.88rem',marginBottom:3}}>Scene {sc.scene_id} — {sc.location}</div>
                <div style={{color:'var(--muted)',fontSize:'.8rem',marginBottom:5}}>{sc.characters?.join(', ')}</div>
                {(sc.dialogue||[]).slice(0,2).map((dl,j)=>(
                  <div key={j} style={{borderLeft:'2px solid var(--accent)',paddingLeft:8,marginBottom:3,fontSize:'.8rem',color:'var(--muted)'}}>
                    <strong style={{color:'var(--text)'}}>{dl.speaker}:</strong> "{dl.line}"
                  </div>
                ))}
              </div>
            ))}
          </div>
          <div className="field">
            <label>Edit JSON (optional)</label>
            <textarea value={hitlEdit} onChange={e=>setHitlEdit(e.target.value)} rows={3}
              placeholder='{"title":"…","scenes":[…]}' style={{fontFamily:'monospace',fontSize:'.8rem'}}/>
          </div>
          <div className="btn-row">
            <button className="btn btn-primary" onClick={()=>submitHitl('yes')}>✅ Approve — proceed to audio</button>
            <button className="btn btn-secondary" onClick={()=>submitHitl('edit')} disabled={!hitlEdit.trim()}>✏️ Apply edit & proceed</button>
            <button className="btn btn-danger" onClick={()=>submitHitl('no')}>❌ Reject</button>
          </div>
        </div>
      )}

      {/* ── STAGE: p1 done ── */}
      {stage==='p1_done' && (
        <div className="card">
          <h3>✅ Script complete — ready for audio <StatusPill status="complete"/></h3>
          {p1Result && (
            <div className="result-box" style={{marginBottom:14}}>
              {Object.entries(p1Result).map(([k,v])=>(
                <div key={k} className="result-row">
                  <span className="result-key">{k}</span>
                  <span className="result-val">{String(v)}</span>
                </div>
              ))}
            </div>
          )}
          <div className="btn-row">
            <button className="btn btn-primary" onClick={runP2}>🎵 Proceed to Audio Generation →</button>
          </div>
        </div>
      )}

      {/* ── STAGE: p2 running ── */}
      {stage==='p2_running' && (
        <div className="card">
          <h3>Step 2 of 3 — Generating Audio… <StatusPill status="running"/></h3>
          <div style={{color:'var(--muted)',fontSize:'.82rem',marginBottom:10}}>
            Synthesising dialogue with Edge-TTS and fetching background music.
          </div>
          <LogBox logs={p2Logs}/>
        </div>
      )}

      {/* ── STAGE: p2 done ── */}
      {stage==='p2_done' && (
        <div className="card">
          <h3>✅ Audio complete — ready for video <StatusPill status="complete"/></h3>
          {p2Result && (
            <div className="result-box" style={{marginBottom:10}}>
              {[['run_id','run_id'],['duration_ms','duration_ms'],['run_id','run_id']].filter(([k])=>p2Result[k])
                .concat(Object.entries(p2Result).filter(([k])=>!['master_audio','timing_manifest','output_dir'].includes(k)))
                .filter(([k,],i,a)=>a.findIndex(([x])=>x===k)===i)
                .map(([k,v])=>(
                  <div key={k} className="result-row">
                    <span className="result-key">{k}</span>
                    <span className="result-val">{String(v)}</span>
                  </div>
                ))}
            </div>
          )}
          {p2Result?.run_id && (
            <div style={{marginBottom:14}}>
              <audio controls style={{width:'100%'}} src={`/api/files/audio/${p2Result.run_id}`}/>
            </div>
          )}
          <div className="field">
            <label>Video Options</label>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {[
                ['mock','🖼 Mock images (fast, no HF API)',mock,setMock],
                ['short','⚡ Short mode (1 scene)',short,setShort],
                ['subs','💬 Burn subtitles',subtitles,setSubs],
              ].map(([k,label,val,setter])=>(
                <button key={k} className={`toggle-btn ${val?'active':''}`}
                  style={{flex:'0 0 auto',padding:'8px 14px'}} onClick={()=>setter(v=>!v)}>
                  {label}
                </button>
              ))}
            </div>
          </div>
          <div className="btn-row">
            <button className="btn btn-primary" onClick={runP3}>🎬 Proceed to Video Generation →</button>
          </div>
        </div>
      )}

      {/* ── STAGE: p3 running ── */}
      {stage==='p3_running' && (
        <div className="card">
          <h3>Step 3 of 3 — Generating Video… <StatusPill status="running"/></h3>
          <div style={{color:'var(--muted)',fontSize:'.82rem',marginBottom:10}}>
            Generating scene images, animating with Ken Burns effect, composing final MP4.
          </div>
          <LogBox logs={p3Logs}/>
        </div>
      )}

      {/* ── STAGE: p3 done ── */}
      {stage==='p3_done' && (
        <div className="card" style={{borderColor:'var(--success)'}}>
          <h3 style={{color:'var(--success)'}}>🎉 Pipeline complete! <StatusPill status="complete"/></h3>
          {p3Result?.final_video && (
            <div style={{margin:'12px 0'}}>
              <video className="video-player" controls
                src={p3Result.use_subtitles
                  ? `/api/files/video/${p3Result.run_id}/captioned`
                  : `/api/files/video/${p3Result.run_id}`}/>
            </div>
          )}
          {p3Result && (
            <div className="result-box" style={{marginBottom:14}}>
              {Object.entries(p3Result)
                .filter(([k])=>!['final_video','run_dir'].includes(k))
                .map(([k,v])=>(
                  <div key={k} className="result-row">
                    <span className="result-key">{k}</span>
                    <span className="result-val">{String(v)}</span>
                  </div>
                ))}
            </div>
          )}
          <div className="btn-row">
            {p3Result?.run_id && (
              <a href={p3Result.use_subtitles
                ? `/api/files/video/${p3Result.run_id}/captioned`
                : `/api/files/video/${p3Result.run_id}`} download>
                <button className="btn btn-secondary">⬇ Download Video</button>
              </a>
            )}
            <button className="btn btn-primary" onClick={()=>setPage('phase5')}>
              ✏️ Open Edit Agent →
            </button>
            <button className="btn btn-secondary" onClick={reset}>↩ Start new pipeline</button>
          </div>
        </div>
      )}

      {/* ── STAGE: failed ── */}
      {stage==='failed' && (
        <div className="card" style={{borderColor:'var(--error)'}}>
          <h3>Pipeline failed <StatusPill status="failed"/></h3>
          <div style={{color:'var(--error)',marginBottom:12,fontSize:'.88rem'}}>{error}</div>
          {p1Logs.length>0 && <LogBox logs={p1Logs}/>}
          {p2Logs.length>0 && <LogBox logs={p2Logs}/>}
          {p3Logs.length>0 && <LogBox logs={p3Logs}/>}
          <div className="btn-row" style={{marginTop:14}}>
            <button className="btn btn-secondary" onClick={reset}>↩ Start over</button>
          </div>
        </div>
      )}
    </div>
  );
}
function App() {
  const [page, setPage] = useState('pipeline');

  const nav = [
    {id:'pipeline', label:'Pipeline',       icon:'🚀', badge:'START HERE'},
    {id:'overview', label:'Overview',       icon:'🏠'},
    {id:'phase1',   label:'Phase 1',        icon:'📝'},
    {id:'phase2',   label:'Phase 2',        icon:'🎵'},
    {id:'phase3',   label:'Phase 3',        icon:'🎬'},
    {id:'phase5',   label:'Phase 5 — Edit', icon:'✏️'},
    {id:'runs',     label:'Run History',    icon:'📂'},
  ];

  const pages = {
    pipeline:<PipelinePage setPage={setPage}/>,
    overview:<OverviewPage setPage={setPage}/>,
    phase1:<Phase1Page/>,
    phase2:<Phase2Page/>,
    phase3:<Phase3Page/>,
    phase5:<Phase5Page/>,
    runs:<RunsPage/>,
  };

  return (
    <div className="app">
      <div className="header">
        <div>
          <h1>Project Montage</h1>
          <div className="subtitle">AI Video Generation Pipeline</div>
        </div>
        <div style={{marginLeft:'auto',display:'flex',gap:8}}>
          <a href="/docs" target="_blank"><button className="btn btn-secondary" style={{fontSize:'.8rem',padding:'6px 12px'}}>API Docs</button></a>
        </div>
      </div>
      <div className="main">
        <div className="sidebar">
          {nav.map(n=>(
            <div key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={()=>setPage(n.id)}>
              <span>{n.icon}</span><span>{n.label}</span>
              {n.badge && <span className="nav-badge" style={{fontSize:'.6rem',padding:'1px 5px'}}>{n.badge}</span>}
            </div>
          ))}
        </div>
        <div className="content">{pages[page]||pages.pipeline}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
